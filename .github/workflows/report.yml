name: Report

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Report date (YYYY-MM-DD); blank = today"
        required: false
        type: string
  # Send cadence undecided. Uncomment and set a cron once decided (UTC-based).
  # KST 08:00 == "0 23 * * *"  (23:00 UTC the previous day)
  # NOTE: GitHub cron is unreliable for high-frequency schedules (e.g. */5) on new
  # public repos; daily/weekly cadences run far more consistently. Manual runs via
  # the Actions "Run workflow" button (workflow_dispatch) are verified working.
  # schedule:
  #   - cron: "0 23 * * *"

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Run pipeline
        env:
          RUN_DATE: ${{ inputs.date }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          REPORT_TZ: ${{ secrets.REPORT_TZ }}
        run: |
          if [ -n "$RUN_DATE" ]; then
            python -m report_pipeline --date "$RUN_DATE"
          else
            python -m report_pipeline
          fi
      - name: Upload workbook on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: report-xlsx
          path: build/*.xlsx
          if-no-files-found: ignore
